name: CMake CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Zeal development environment
        uses: zoul0813/zeal-dev-environment/github/setup-zde@main

      - name: Build with the Zeal CMake toolchain
        run: zde cmake

      - name: Save the binary
        uses: actions/upload-artifact@v4
        with:
          name: 2048
          path: bin/2048.bin
          if-no-files-found: error
